[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-compactor"
version = "0.1.0"
description = "Turn a podcast into a ~30-minute chronological digest episode."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "arq>=0.25",
    "sqlalchemy>=2.0",
    "langgraph>=0.2",
    "langchain-anthropic>=0.2",
    "langchain-core>=0.3",
    "feedparser>=6.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=0.2",
    # Cross-episode speaker clustering is imported by the worker even in fake
    # mode (`./launch --fake` runs `uv sync` without [gpu]).
    "numpy>=2.0",
]

[project.optional-dependencies]
# Heavy ML backends, only needed on a GPU host (imported lazily).
gpu = [
    "torch",
    "faster-whisper",
    "f5-tts",
    "kokoro",
    "pyannote.audio",
    "audioseal",
    # CUDA 12 runtime for faster-whisper's CTranslate2 backend. A CUDA 13 PyTorch
    # build only ships libcublas.so.13, so CTranslate2 (built for CUDA 12) can't
    # load libcublas.so.12 without these. See transcribe/faster_whisper.py.
    "nvidia-cublas-cu12",
    "nvidia-cuda-runtime-cu12",
]

[dependency-groups]
# Dev tooling — installed by `uv sync` by default, excluded from the built wheel.
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
